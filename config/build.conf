#!/usr/bin/env bash
# XueOS build farm — shared configuration
# Sourced by build-iso.sh and the Makefile. Keep this POSIX-ish (no arrays
# expanded outside bash) since it's sourced with `set -u` active.

# --- Base system -------------------------------------------------------
DISTRO_CODENAME="noble"          # Ubuntu 24.04 LTS
DISTRO_ARCH="amd64"
DISTRO_MIRROR="http://archive.ubuntu.com/ubuntu"

# --- Identity ------------------------------------------------------------
XUEOS_NAME="XueOS"
XUEOS_VERSION="dev"
ISO_LABEL="XUEOS_DEV_AMD64"
ISO_FILENAME="xueos-dev-amd64.iso"

# --- Default OS user -----------------------------------------------------
DEFAULT_USER="xue"
# No password is committed here (this repo is public). Autologin means it's
# rarely typed anyway, but set a real value in config/build.local.conf (see
# config/build.local.conf.example) — this is just the fallback if that file
# is absent.
DEFAULT_USER_PASSWORD="xue"

# --- Filesystem layout -----------------------------------------------------
BUILDER_ROOT="/var/lib/xueos-builder"
WORK_DIR="${BUILDER_ROOT}/work"          # scratch: chroot + staging live here
CHROOT_DIR="${WORK_DIR}/chroot"
ISO_STAGING_DIR="${WORK_DIR}/iso"
OUTPUT_DIR="${BUILDER_ROOT}/output"      # finished ISO lands here first
WEB_PUBLISH_DIR="/var/www/xueos.mp.ls/iso"   # then gets copied here for nginx to serve

# --- Developer repos cloned into the image at /opt/xfce-dev ---------------
# Format: "name|git-url" — add more lines as needed. xfce4-panel/xfwm4 are
# real upstream XFCE components (from XFCE's own GitLab) so there's
# something to build immediately on boot — the whole point of this image is
# to be a ready-to-go XFCE dev environment, not a themed desktop.
DEV_REPOS="
besra|https://github.com/mplsllc/besra.git
xfce4-panel|https://gitlab.xfce.org/xfce/xfce4-panel.git
xfwm4|https://gitlab.xfce.org/xfce/xfwm4.git
"

# --- Package lists ---------------------------------------------------------
BASE_PACKAGES="systemd-sysv,dbus,network-manager,sudo,locales,ca-certificates,linux-generic,zstd"

XFCE_PACKAGES="xorg,x11-xserver-utils,lightdm,lightdm-gtk-greeter,xfce4,xfce4-terminal,xfce4-goodies,xfce4-power-manager,thunar,network-manager-gnome"

# xfce4-dev-tools provides xdt-autogen, required to bootstrap any xfce4/
# libxfce4-* component built straight from a git checkout (autotools-based
# ones, at least — meson/ninja cover the components migrating off that).
# gdb for debugging the running desktop session itself.
#
# libgtk-3-dev/libxfce4ui-2-dev/libxfce4util-dev stay regardless of Besra's
# own toolkit choice — XFCE itself (xfce4-panel, xfwm4, etc.) is GTK3-based
# upstream, and building those is the actual point of this image.
#
# qt6-base-dev/qt6-tools-dev(-tools) replace the earlier libsoup-3.0-dev +
# libwebkit2gtk-4.1-dev guess: Besra is moving to Qt6 for cross-platform
# dev, not embedding WebKitGTK, so those are the wrong headers now.
DEV_PACKAGES="build-essential,git,cmake,meson,ninja-build,pkg-config,xfce4-dev-tools,gdb,libgtk-3-dev,libxfce4ui-2-dev,libxfce4util-dev,qt6-base-dev,qt6-tools-dev,qt6-tools-dev-tools,curl,vim,less"

# lupin-casper (Wubi Windows-installer support) was dropped from Ubuntu's
# archive around 13.x and no longer exists in noble; deliberately omitted.
#
# calamares: the actual "Install XueOS to a drive" capability. Config lives
# in overlay/etc/calamares/ (adapted from calamares-settings-ubuntu-common +
# calamares-settings-lubuntu — real, maintained noble-targeted configs used
# as a verified reference rather than hand-written blind), branding in
# overlay/etc/calamares/branding/xueos/.
#
# squashfs-tools: calamares's unpackfs module needs `unsquashfs` on the LIVE
# image itself to unpack /cdrom/casper/filesystem.squashfs onto the target
# disk during install — this is only a Recommends on the calamares package,
# not a hard Depends, so it silently never installed under
# --no-install-recommends. Confirmed by actually running the installer:
# "Failed to find unsquashfs, make sure you have the squashfs-tools package
# installed."
# btrfs-progs/xfsprogs: our own partition.conf offers btrfs and xfs as
# selectable filesystem choices (not just ext4) — without the matching
# mkfs.* tools on the live image, picking either would fail the same way
# squashfs-tools did. e2fsprogs (mkfs.ext4) is already pulled in as a core
# system dependency regardless, so not listed explicitly here.
LIVE_BOOT_PACKAGES="casper,discover,laptop-detect,os-prober,grub-pc-bin,grub-efi-amd64-bin,grub-efi-amd64-signed,shim-signed,plymouth,plymouth-label,calamares,squashfs-tools,btrfs-progs,xfsprogs"

# Packages we explicitly refuse to let onto the image.
BLOCKED_PACKAGES="snapd"

# --- Package repository (aptly) --------------------------------------------
# Reuses the existing native aptly install at ~/.aptly (already serving the
# qtirc repo at https://apt.mp.ls under distribution "stable") rather than
# standing up a second, Dockerized instance. New packages get their own
# distribution so they never touch the existing qtirc publish.
# Hardcoded (not derived from $HOME) because this is read both by
# publish-deb.sh (runs as patrick) and build-iso.sh (runs as root via sudo,
# where $HOME is /root) — they need to agree on the same path.
APTLY_ROOT="/home/patrick/.aptly"
APTLY_REPO_NAME="besra"
APTLY_REPO_COMMENT="Besra browser releases"
APTLY_DISTRIBUTION="besra"
APTLY_COMPONENT="main"
# GPG key to sign with. Empty = aptly's configured default (the existing
# "qtIRC APT Repository <apt@mp.ls>" key already on this box).
APTLY_GPG_KEY=""
APT_PUBLIC_URL="https://apt.mp.ls"

# --- Local overrides ---------------------------------------------------
# config/build.local.conf is git-ignored. Put real secrets / per-host
# overrides there (e.g. DEFAULT_USER_PASSWORD). Sourced last, so it wins
# over every default above. See config/build.local.conf.example.
if [[ -f "${BASH_SOURCE%/*}/build.local.conf" ]]; then
    # shellcheck source=config/build.local.conf
    source "${BASH_SOURCE%/*}/build.local.conf"
fi
