---
# Minneapolis has no separate IANA zone of its own — it shares
# America/Chicago (Central Time) with every other city on the same
# offset/DST ruleset. This *is* Minneapolis's real timezone, just named
# after tzdata's representative city for that zone.
region: "America"
zone: "Chicago"
localeGenPath: "/etc/locale.gen"
geoip:
    style: "xml"
    url:   "https://geoip.ubuntu.com/lookup"
    selector: "TimeZone"
