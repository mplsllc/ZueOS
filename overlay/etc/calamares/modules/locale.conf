---
# IANA's zone1970.tab/zone.tab have no Minneapolis entry — it shares
# America/Chicago's rules with every other city on the same offset/DST
# ruleset. Rather than just default to the Chicago label, this project adds
# its own America/Minneapolis zone (a symlink to Chicago's compiled tzdata,
# same technique tzdata itself uses for equivalent zones) plus matching
# zone1970.tab/zone.tab entries — see overlay/usr/share/zoneinfo/. That
# makes "Minneapolis" a real, independently selectable entry in any
# tzdata-driven picker, not just a relabeled default.
region: "America"
zone: "Minneapolis"
localeGenPath: "/etc/locale.gen"
geoip:
    style: "xml"
    url:   "https://geoip.ubuntu.com/lookup"
    selector: "TimeZone"
