---
# Workaround for Ubuntu installer bug LP#1829805: touch a placeholder
# initrd before the initramfs module runs. Doubly relevant here — we hit
# our own version of "the initrd doesn't actually exist yet" bug in the
# live-build chroot itself (see build-iso.sh), so this kind of defensive
# placeholder is worth keeping regardless of the original bug's specifics.
dontChroot: false
timeout: 30
script:
    - "touch ${ROOT}/boot/initrd.img-$(uname -r)"
