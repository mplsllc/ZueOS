update_db: true
backend: apt
operations:
  - remove:
      - "^live-*"
      - casper
      - discover
      - calamares
  - try_install:
      # LibreOffice isn't shipped on this image, so no libreoffice-l10n/
      # -help entries here (they'd be no-ops anyway via try_install, but
      # no point listing packages for software we don't install).
      - language-pack-$LOCALE
      - hunspell-$LOCALE
