---
# XueOS Calamares pipeline. Adapted from calamares-settings-ubuntu-common /
# calamares-settings-lubuntu (both real, maintained noble-targeted configs —
# used as a base rather than hand-writing this blind) with Lubuntu/OEM/snap-
# specific steps dropped: pkgselect + pkgselect_snap (optional package
# picker UI, not needed), automirror + snap-seed-glue (snap store seeding —
# irrelevant, we block snapd), oem-setup/oemprep (OEM pre-install mode),
# add386arch (i386 multiarch, not needed), shellprocess_logs (depends on a
# Lubuntu-only helper binary we don't have).
modules-search: [ local ]

instances:
- id: initrd_placeholder
  module: shellprocess
  config: shellprocess_initrd_placeholder.conf
- id: fixconkeys_part1
  module: shellprocess
  config: shellprocess_fixconkeys_part1.conf
- id: fixconkeys_part2
  module: shellprocess
  config: shellprocess_fixconkeys_part2.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess@initrd_placeholder
  - initramfscfg
  - initramfs
  - grubcfg
  - bootloader
  - shellprocess@fixconkeys_part1
  - shellprocess@fixconkeys_part2
  - packages
  - umount
- show:
  - finished

branding: xueos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
